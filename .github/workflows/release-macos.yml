name: Release macOS

on:
  push:
    branches: [personal/macos]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Create app bundle
        run: |
          APP_NAME="Pandora Launcher"
          APP_BUNDLE="${APP_NAME}.app"

          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"

          # Copy binary
          cp target/release/pandora_launcher "${APP_BUNDLE}/Contents/MacOS/PandoraLauncher"

          # Generate icon
          ICONSET="AppIcon.iconset"
          mkdir -p "$ICONSET"
          SVG="assets/icons/pandora.svg"

          magick -background none -density 384 "$SVG" -resize 16x16 "$ICONSET/icon_16x16.png"
          magick -background none -density 384 "$SVG" -resize 32x32 "$ICONSET/icon_16x16@2x.png"
          magick -background none -density 384 "$SVG" -resize 32x32 "$ICONSET/icon_32x32.png"
          magick -background none -density 384 "$SVG" -resize 64x64 "$ICONSET/icon_32x32@2x.png"
          magick -background none -density 384 "$SVG" -resize 128x128 "$ICONSET/icon_128x128.png"
          magick -background none -density 384 "$SVG" -resize 256x256 "$ICONSET/icon_128x128@2x.png"
          magick -background none -density 384 "$SVG" -resize 256x256 "$ICONSET/icon_256x256.png"
          magick -background none -density 384 "$SVG" -resize 512x512 "$ICONSET/icon_256x256@2x.png"
          magick -background none -density 384 "$SVG" -resize 512x512 "$ICONSET/icon_512x512.png"
          magick -background none -density 384 "$SVG" -resize 1024x1024 "$ICONSET/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET" -o "${APP_BUNDLE}/Contents/Resources/AppIcon.icns"

          # Create Info.plist
          cat > "${APP_BUNDLE}/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>PandoraLauncher</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundleIdentifier</key><string>com.moulberry.pandora-launcher</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>Pandora Launcher</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          </dict>
          </plist>
          EOF

      - name: Create ZIP archive
        run: |
          zip -r "PandoraLauncher-macos.zip" "Pandora Launcher.app"
          shasum -a 256 "PandoraLauncher-macos.zip" > "PandoraLauncher-macos.zip.sha256"

      - name: Generate version tag
        id: version
        run: |
          # Use date + run number for version
          VERSION="0.1.0-$(date +%Y%m%d).${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pandora Launcher v${{ steps.version.outputs.version }}
          body: |
            Automated build from `personal/macos` branch.

            Commit: ${{ github.sha }}

            ## Install via Homebrew
            ```bash
            brew tap starbirdtech/pandora
            brew install --cask pandora-launcher
            ```
          files: |
            PandoraLauncher-macos.zip
            PandoraLauncher-macos.zip.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(cat PandoraLauncher-macos.zip.sha256 | awk '{print $1}')

          # Clone the tap repo
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/StarbirdTech/homebrew-pandora.git tap-repo || true

          if [ -d "tap-repo" ]; then
            cd tap-repo

            mkdir -p Casks

            cat > Casks/pandora-launcher.rb << EOF
          cask "pandora-launcher" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/StarbirdTech/PandoraLauncher/releases/download/v#{version}/PandoraLauncher-macos.zip"
            name "Pandora Launcher"
            desc "Minecraft launcher with mod deduplication and secure credential management"
            homepage "https://github.com/Moulberry/PandoraLauncher"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Pandora Launcher.app"

            postflight do
              system_command "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister",
                             args: ["-f", "#{appdir}/Pandora Launcher.app"]
            end

            zap trash: [
              "~/Library/Application Support/PandoraLauncher",
              "~/Library/Caches/PandoraLauncher",
            ]
          end
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Casks/pandora-launcher.rb
            git commit -m "Update pandora-launcher to v${VERSION}" || echo "No changes to commit"
            git push || echo "Push failed - may need to create homebrew-pandora repo"
          fi
